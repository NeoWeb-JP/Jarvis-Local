name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall -q custom_components/jarvis_local
      - run: node --check custom_components/jarvis_local/panel.js
      - run: python -m pip install pytest
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: python -m pytest -q tests
      - run: node tests/test_panel_voice.js
      - run: node tests/test_panel_version.js
      - run: node tests/test_panel_media_search.js
      - run: node tests/test_panel_favourites.js
      - run: node tests/test_panel_satellite_settings.js
      - run: node tests/test_panel_stop_diagnostics.js
      - run: node tests/test_panel_phrase_cache.js
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
